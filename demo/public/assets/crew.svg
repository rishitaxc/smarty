<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 170" width="600" height="170">
<title>Sidekick crew: Pip, Scout, Bolt and Gate</title>
<style id="crew-style">
.crew{overflow:visible}
.crew .ink{fill:#141414;stroke:#141414;stroke-width:9;stroke-linejoin:round;stroke-linecap:round}
.crew .leg{stroke:#141414;stroke-width:4.5;stroke-linecap:round}
.crew .eye,.crew .mouth,.crew .happy-eye,.crew .spark,.crew .tool{transform-box:fill-box;transform-origin:center}
.crew .eye{fill:#141414;animation:crew-blink 4.6s infinite}
.crew .cheek{fill:#f59aa8;opacity:.55}
.crew .mouth{fill:#5a2020;display:none}
.crew .happy-eye{fill:none;stroke:#141414;stroke-width:3.2;stroke-linecap:round;display:none}
.crew .body-g{transform-box:fill-box;transform-origin:50% 100%;animation:crew-bob 2.6s ease-in-out infinite}
.crew .wave{transform-box:view-box;animation:crew-wave 2.6s ease-in-out infinite}
.crew .sway{transform-box:view-box;animation:crew-sway 3.4s ease-in-out infinite}
.crew .spark{fill:#ffe27a;opacity:0}
.crew .tool{display:none}
.crew .siren-glow{fill:#9fb3c8;transition:fill .2s}
.pip .wave{transform-origin:47px 75px}.pip .sway{transform-origin:70px 52px}
.scout .wave{transform-origin:96px 82px}.scout .sway{transform-origin:70px 58px}
.bolt .wave{transform-origin:44px 76px}.bolt .sway{transform-origin:70px 54px}
.gate .wave{transform-origin:42px 76px}.gate .sway{transform-origin:70px 50px}
.scout .eye{animation-delay:1.3s}.bolt .eye{animation-delay:2.1s}.gate .eye{animation-delay:.6s}
.scout .body-g{animation-delay:-.7s}.bolt .body-g{animation-delay:-1.4s}.gate .body-g{animation-delay:-2s}

/* talk */
.crew.talk .mouth{display:block;animation:crew-talk .16s ease-in-out infinite alternate}
.crew.talk .body-g{animation:crew-bob 1s ease-in-out infinite}
/* work */
.crew.work .body-g{animation:crew-hop .5s ease-in-out infinite}
.crew.work .wave{animation:crew-pump .5s ease-in-out infinite}
.crew.work .spark{animation:crew-spark 1s ease-out infinite}
.crew.work .spark:nth-of-type(2){animation-delay:.33s}.crew.work .spark:nth-of-type(3){animation-delay:.66s}
.crew.work .tool{display:block;animation:crew-scan 1.2s ease-in-out infinite}
/* alert */
.crew.alert .body-g{animation:crew-jolt .6s ease-in-out infinite}
.crew.alert .eye{animation:none;transform:scale(1.4)}
/* happy */
.crew.happy .eye{display:none}.crew.happy .happy-eye{display:block}
.crew.happy .body-g{animation:crew-hop .6s ease-in-out infinite}
.crew.happy .wave{animation:crew-wave .5s ease-in-out infinite}
/* gate */
.crew.deny .body-g{animation:crew-no .45s ease-in-out 3}
.crew.deny .siren-glow{fill:#ff5a4e;animation:crew-flash .3s steps(2) infinite}
.crew.deny .eye{animation:none;transform:scaleY(.55)}
.crew.approve .siren-glow{fill:#44d07b}
.crew.approve .eye{display:none}.crew.approve .happy-eye{display:block}
.crew.approve .body-g{animation:crew-hop .6s ease-in-out 3}
/* sleep */
.crew.sleep{opacity:.5;filter:saturate(.35)}
.crew.sleep .eye{animation:none;transform:scaleY(.15)}
.crew.sleep .body-g{animation:crew-bob 5s ease-in-out infinite}

@keyframes crew-bob{0%,100%{transform:translateY(0) scale(1.02,.98)}50%{transform:translateY(-3px) scale(.98,1.02)}}
@keyframes crew-hop{0%,100%{transform:translateY(0) scale(1.05,.95)}45%{transform:translateY(-10px) scale(.96,1.05)}}
@keyframes crew-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes crew-wave{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(12deg)}}
@keyframes crew-sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes crew-pump{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(18deg)}}
@keyframes crew-talk{from{transform:scale(1,.25)}to{transform:scale(1,1.15)}}
@keyframes crew-spark{0%{opacity:0;transform:scale(.2) translateY(0)}30%{opacity:1}100%{opacity:0;transform:scale(1.1) translateY(-14px)}}
@keyframes crew-jolt{0%,100%{transform:translate(0,0)}20%{transform:translate(-3px,-6px) rotate(-3deg)}40%{transform:translate(3px,-6px) rotate(3deg)}60%{transform:translate(0,0)}}
@keyframes crew-no{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
@keyframes crew-flash{50%{fill:#ffd1cc}}
@keyframes crew-scan{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(-6px,4px) rotate(-12deg)}}
@media (prefers-reduced-motion:reduce){.crew *{animation:none!important}}
</style>

<!-- PIP: guide. Green sprout. -->
<svg id="pip" class="crew pip" x="0" y="15" width="140" height="140" viewBox="0 0 140 140">
  <defs>
    <path id="pip-stem" d="M71 54 C70 42 73 32 81 24"/>
    <ellipse id="pip-leaf" cx="88" cy="20" rx="10" ry="6" transform="rotate(-38 88 20)"/>
    <ellipse id="pip-armL" cx="38" cy="66" rx="11.5" ry="8" transform="rotate(-38 38 66)"/>
    <ellipse id="pip-armR" cx="101" cy="94" rx="8.5" ry="10.5" transform="rotate(-25 101 94)"/>
    <ellipse id="pip-body" cx="70" cy="83" rx="34" ry="31"/>
  </defs>
  <line class="leg" x1="62" y1="100" x2="62" y2="127"/><line class="leg" x1="78" y1="100" x2="78" y2="127"/>
  <g class="body-g">
    <g class="ink">
      <use href="#pip-stem" class="sway" fill="none" stroke-width="11"/><use href="#pip-leaf" class="sway"/>
      <use href="#pip-armL" class="wave"/><use href="#pip-armR"/><use href="#pip-body"/>
    </g>
    <g fill="#c5e8b0">
      <use href="#pip-stem" class="sway" fill="none" stroke="#c5e8b0" stroke-width="3.5" stroke-linecap="round"/><use href="#pip-leaf" class="sway"/>
      <use href="#pip-armL" class="wave"/><use href="#pip-armR"/><use href="#pip-body"/>
    </g>
    <ellipse class="cheek" cx="53" cy="92" rx="5" ry="3"/><ellipse class="cheek" cx="87" cy="92" rx="5" ry="3"/>
    <circle class="eye" cx="61" cy="83" r="4.2"/><circle class="eye" cx="79" cy="83" r="4.2"/>
    <path class="happy-eye" d="M57 85 Q61 79 65 85"/><path class="happy-eye" d="M75 85 Q79 79 83 85"/>
    <ellipse class="mouth" cx="70" cy="94" rx="3.6" ry="3"/>
    <path class="spark" d="M112 40 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/><path class="spark" d="M24 46 l1.6 4 4 1.6 -4 1.6 -1.6 4 -1.6 -4 -4 -1.6 4 -1.6z"/><path class="spark" d="M114 70 l1.4 3.5 3.5 1.4 -3.5 1.4 -1.4 3.5 -1.4 -3.5 -3.5 -1.4 3.5 -1.4z"/>
  </g>
</svg>

<!-- SCOUT: research. Lavender with a tuft. Carries a magnifier while working. -->
<svg id="scout" class="crew scout" x="150" y="15" width="140" height="140" viewBox="0 0 140 140">
  <defs>
    <ellipse id="scout-t1" cx="61" cy="55" rx="5.5" ry="9" transform="rotate(-28 61 55)"/>
    <ellipse id="scout-t2" cx="70" cy="50" rx="5.5" ry="10.5"/>
    <ellipse id="scout-t3" cx="79" cy="55" rx="5.5" ry="9" transform="rotate(28 79 55)"/>
    <ellipse id="scout-wingL" cx="37" cy="83" rx="13" ry="8" transform="rotate(-14 37 83)"/>
    <ellipse id="scout-wingR" cx="103" cy="83" rx="13" ry="8" transform="rotate(14 103 83)"/>
    <ellipse id="scout-body" cx="70" cy="85" rx="35" ry="30"/>
  </defs>
  <line class="leg" x1="62" y1="100" x2="62" y2="127"/><line class="leg" x1="78" y1="100" x2="78" y2="127"/>
  <g class="body-g">
    <g class="ink">
      <use href="#scout-t1" class="sway"/><use href="#scout-t2" class="sway"/><use href="#scout-t3" class="sway"/>
      <use href="#scout-wingL"/><use href="#scout-wingR" class="wave"/><use href="#scout-body"/>
    </g>
    <g fill="#cdb4e6">
      <use href="#scout-t1" class="sway"/><use href="#scout-t2" class="sway"/><use href="#scout-t3" class="sway"/>
      <use href="#scout-wingL"/><use href="#scout-wingR" class="wave"/><use href="#scout-body"/>
    </g>
    <ellipse class="cheek" cx="52" cy="94" rx="5" ry="3"/><ellipse class="cheek" cx="88" cy="94" rx="5" ry="3"/>
    <circle class="eye" cx="61" cy="85" r="4.2"/><circle class="eye" cx="79" cy="85" r="4.2"/>
    <path class="happy-eye" d="M57 87 Q61 81 65 87"/><path class="happy-eye" d="M75 87 Q79 81 83 87"/>
    <ellipse class="mouth" cx="70" cy="96" rx="3.6" ry="3"/>
    <g class="tool"><line x1="104" y1="96" x2="114" y2="84" stroke="#141414" stroke-width="4.5" stroke-linecap="round"/><circle cx="119" cy="77" r="9" fill="#e6f4ff" fill-opacity=".85" stroke="#141414" stroke-width="4"/></g>
    <path class="spark" d="M24 44 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/><path class="spark" d="M116 46 l1.6 4 4 1.6 -4 1.6 -1.6 4 -1.6 -4 -4 -1.6 4 -1.6z"/><path class="spark" d="M30 70 l1.4 3.5 3.5 1.4 -3.5 1.4 -1.4 3.5 -1.4 -3.5 -3.5 -1.4 3.5 -1.4z"/>
  </g>
</svg>

<!-- BOLT: build. Orange box with an antenna. -->
<svg id="bolt" class="crew bolt" x="300" y="15" width="140" height="140" viewBox="0 0 140 140">
  <defs>
    <line id="bolt-ant" x1="70" y1="56" x2="70" y2="37"/>
    <circle id="bolt-ball" cx="70" cy="31" r="6.5"/>
    <ellipse id="bolt-armL" cx="34" cy="70" rx="10.5" ry="8" transform="rotate(-42 34 70)"/>
    <ellipse id="bolt-armR" cx="106" cy="93" rx="8" ry="11" transform="rotate(-15 106 93)"/>
    <rect id="bolt-body" x="39" y="54" width="62" height="58" rx="17"/>
  </defs>
  <line class="leg" x1="62" y1="100" x2="62" y2="127"/><line class="leg" x1="78" y1="100" x2="78" y2="127"/>
  <g class="body-g">
    <g class="ink">
      <use href="#bolt-ant" class="sway" stroke-width="4.5"/><use href="#bolt-ball" class="sway"/>
      <use href="#bolt-armL" class="wave"/><use href="#bolt-armR"/><use href="#bolt-body"/>
    </g>
    <g fill="#fdb27e">
      <use href="#bolt-ant" class="sway" stroke="#141414" stroke-width="4.5"/><use href="#bolt-ball" class="sway"/>
      <use href="#bolt-armL" class="wave"/><use href="#bolt-armR"/><use href="#bolt-body"/>
    </g>
    <ellipse class="cheek" cx="51" cy="93" rx="5" ry="3"/><ellipse class="cheek" cx="89" cy="93" rx="5" ry="3"/>
    <circle class="eye" cx="61" cy="84" r="4.2"/><circle class="eye" cx="79" cy="84" r="4.2"/>
    <path class="happy-eye" d="M57 86 Q61 80 65 86"/><path class="happy-eye" d="M75 86 Q79 80 83 86"/>
    <ellipse class="mouth" cx="70" cy="96" rx="3.6" ry="3"/>
    <g class="tool"><path d="M104 102 l12 -14" stroke="#141414" stroke-width="5" stroke-linecap="round"/><path d="M113 84 a6 6 0 1 0 8 8 l-3 -3 -1 -4 z" fill="#d7dee6" stroke="#141414" stroke-width="3"/></g>
    <path class="spark" d="M112 40 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/><path class="spark" d="M22 48 l1.6 4 4 1.6 -4 1.6 -1.6 4 -1.6 -4 -4 -1.6 4 -1.6z"/><path class="spark" d="M118 66 l1.4 3.5 3.5 1.4 -3.5 1.4 -1.4 3.5 -1.4 -3.5 -3.5 -1.4 3.5 -1.4z"/>
  </g>
</svg>

<!-- GATE: governance. Sky-blue shield with a siren light that turns red to deny and green to approve. -->
<svg id="gate" class="crew gate" x="450" y="15" width="140" height="140" viewBox="0 0 140 140">
  <defs>
    <rect id="gate-siren" x="62" y="38" width="16" height="13" rx="6"/>
    <ellipse id="gate-armL" cx="36" cy="80" rx="8.5" ry="11" transform="rotate(22 36 80)"/>
    <ellipse id="gate-armR" cx="104" cy="80" rx="8.5" ry="11" transform="rotate(-22 104 80)"/>
    <path id="gate-body" d="M42 58 Q42 50 50 50 L90 50 Q98 50 98 58 L98 84 Q98 106 70 116 Q42 106 42 84 Z"/>
  </defs>
  <line class="leg" x1="62" y1="100" x2="62" y2="127"/><line class="leg" x1="78" y1="100" x2="78" y2="127"/>
  <g class="body-g">
    <g class="ink">
      <use href="#gate-siren" class="sway"/><use href="#gate-armL" class="wave"/><use href="#gate-armR"/><use href="#gate-body"/>
    </g>
    <g fill="#a9d3f5">
      <use href="#gate-siren" class="sway siren-glow"/><use href="#gate-armL" class="wave"/><use href="#gate-armR"/><use href="#gate-body"/>
    </g>
    <ellipse class="cheek" cx="52" cy="84" rx="5" ry="3"/><ellipse class="cheek" cx="88" cy="84" rx="5" ry="3"/>
    <circle class="eye" cx="61" cy="75" r="4.2"/><circle class="eye" cx="79" cy="75" r="4.2"/>
    <path class="happy-eye" d="M57 77 Q61 71 65 77"/><path class="happy-eye" d="M75 77 Q79 71 83 77"/>
    <ellipse class="mouth" cx="70" cy="86" rx="3.6" ry="3"/>
    <g fill="#141414" opacity=".28"><circle cx="70" cy="96" r="4"/><path d="M67.5 98 L72.5 98 L71.6 105 L68.4 105 Z"/></g>
    <path class="spark" d="M114 40 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/><path class="spark" d="M22 48 l1.6 4 4 1.6 -4 1.6 -1.6 4 -1.6 -4 -4 -1.6 4 -1.6z"/><path class="spark" d="M118 70 l1.4 3.5 3.5 1.4 -3.5 1.4 -1.4 3.5 -1.4 -3.5 -3.5 -1.4 3.5 -1.4z"/>
  </g>
</svg>
</svg>
