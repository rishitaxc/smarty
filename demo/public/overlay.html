<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidekick Overlay</title>
<style>
:root{
  --ink:#f2f5f8;--muted:rgba(255,255,255,.55);--dim:rgba(255,255,255,.35);--accent:#9be58a;
  --hot:#ff5a4e;--mint:#7cf0c0;--amber:#ffbf47;--paper:#fbfaf5;--paper-ink:#1c232c;
  --pip:#c5e8b0;--scout:#cdb4e6;--bolt:#fdb27e;--gate:#a9d3f5;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif;--rounded:ui-rounded,"SF Pro Rounded",-apple-system,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;--hand:"Chalkboard SE","Marker Felt","Comic Neue",cursive;
  --top:38px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#f2f5f8}}
:root[data-theme="dark"]{--ink:#f2f5f8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:var(--sans);color:var(--ink);-webkit-user-select:none;user-select:none}
button{font:inherit;cursor:pointer}

/* ---------- notch ---------- */
#notch{position:fixed;left:50%;top:0;transform:translateX(-50%);z-index:80;background:#000;color:#fff;
  border-radius:0 0 18px 18px;width:250px;height:var(--top);overflow:hidden;
  transition:width .55s cubic-bezier(.3,1.25,.4,1),height .55s cubic-bezier(.3,1.25,.4,1),border-radius .4s;box-shadow:0 10px 40px rgba(0,0,0,.0)}
#notch.open{width:560px;height:250px;border-radius:0 0 30px 30px;box-shadow:0 18px 60px rgba(0,0,0,.45)}
#notch.open.tall{height:300px}
/* concave "ears" so the pill flows out of the hardware notch */
#notch::before,#notch::after{content:"";position:absolute;top:0;width:14px;height:14px;pointer-events:none}
#notch{overflow:visible}
#notch::before{left:-14px;background:radial-gradient(circle at 0 100%,transparent 13.5px,#000 14px)}
#notch::after{right:-14px;background:radial-gradient(circle at 100% 100%,transparent 13.5px,#000 14px)}
#notch .clip{overflow:hidden;border-radius:inherit;height:100%}
.nbar{height:var(--top);display:flex;align-items:center;justify-content:space-between;padding:0 14px}
.nbar .face,.nbar svg.crew{width:30px;height:30px;margin-top:2px;flex:none}
.wing{display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;min-width:0}
.wing.l{max-width:120px;font-size:12px;font-weight:600}
.wing.r{max-width:150px;justify-content:flex-end;font-size:11px;color:var(--accent)}
#nAct{overflow:hidden;text-overflow:ellipsis}
#notch.live:not(.open){width:470px}
#notch.open{width:520px}
.bars{display:flex;gap:3px;align-items:center;height:22px;width:30px;justify-content:center}
.bars i{width:3px;border-radius:2px;background:var(--accent);height:4px;transition:height .1s}
.nbody{padding:4px 22px 18px;opacity:0;transition:opacity .25s .1s}
#notch.open .nbody{opacity:1}
.nhead{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:600;letter-spacing:2.4px;color:#fff}
.nhead .dot{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.nhead .st{margin-left:auto;font-size:9px;letter-spacing:1.3px;color:var(--accent);font-weight:500}
.nmain{margin-top:10px;min-height:96px}
.big{font-family:var(--rounded);font-size:25px;font-weight:500;letter-spacing:-.6px;line-height:1.15}
.sub{font-size:12px;color:var(--muted);margin-top:6px}
.q{font-size:11px;color:rgba(255,255,255,.42);margin-bottom:6px}
.listen{display:flex;align-items:center;gap:12px;font-family:var(--rounded);font-size:20px;font-weight:500;min-height:55px}
.think{display:flex;align-items:center;gap:10px;font-size:13px;color:rgba(255,255,255,.7);min-height:45px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.crewrow{display:flex;gap:4px;align-items:flex-end;margin-top:4px}
.crewrow .m{display:flex;flex-direction:column;align-items:center;width:62px}
.crewrow svg{width:54px;height:54px}
.crewrow .n{font-size:9.5px;letter-spacing:1px;color:var(--dim);text-transform:uppercase}
.crewrow .m.on .n{color:#fff}
.nctl{display:flex;align-items:center;gap:12px;margin-top:10px;padding:10px 12px;background:rgba(255,255,255,.065);border-radius:15px}
.mic{width:43px;height:43px;border-radius:50%;border:0;background:var(--accent);display:grid;place-items:center}
.mic.on{background:rgba(155,229,138,.22)}
.nctl .t1{font-size:14px;font-weight:500}.nctl .t2{font-size:10.5px;color:rgba(255,255,255,.4)}
.stages{display:flex;gap:4px;margin-left:auto}
.stages span{font-family:var(--mono);font-size:9px;padding:3px 6px;border-radius:6px;color:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.12)}
.stages span.on{background:var(--accent);color:#06210f;border-color:var(--accent)}
.stages span.done{color:var(--accent);border-color:rgba(155,229,138,.4)}
.acts{display:flex;gap:8px;margin-top:10px}
.acts button{flex:1;border:0;border-radius:12px;padding:13px 16px;font-weight:700;font-size:16px;background:var(--accent);color:#06210f}
.acts button.sec{background:rgba(255,255,255,.1);color:#fff}

/* ---------- capture flash + OCR scan ---------- */
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:70}
#flash.go{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.55}100%{opacity:0}}
#scan{position:fixed;inset:0;pointer-events:none;z-index:20}
#scan b{position:absolute;border:1.5px solid rgba(124,240,192,.85);border-radius:4px;background:rgba(124,240,192,.10);opacity:0;animation:box 1.6s ease-out forwards}
@keyframes box{0%{opacity:0;transform:scale(1.25)}25%{opacity:1;transform:none}100%{opacity:.0}}
#sweep{position:fixed;left:0;right:0;height:120px;top:-120px;background:linear-gradient(180deg,rgba(124,240,192,0),rgba(124,240,192,.18),rgba(124,240,192,0));pointer-events:none;z-index:21}
#sweep.go{animation:sweep 1.8s ease-in-out}
@keyframes sweep{to{top:100%}}

/* ---------- marks on the real screen ---------- */
#marks{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30;overflow:visible}
#marks .ink{fill:none;stroke:var(--hot);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 6px rgba(255,90,78,.45))}
#marks text{font-family:var(--hand);font-size:22px;fill:var(--hot);font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:5px}

/* ---------- 2D sketch board ---------- */
#board{position:fixed;z-index:25;background:var(--paper);color:var(--paper-ink);border-radius:22px;box-shadow:0 30px 90px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.06);
  padding:18px 22px 10px;opacity:0;transform:translateY(16px) scale(.97);transition:opacity .5s,transform .6s cubic-bezier(.2,.9,.2,1),left .8s,top .8s,width .8s,height .8s}
#board.on{opacity:1;transform:none}
#board h2{margin:0;font-family:var(--hand);font-size:26px}
#board .cap{font-family:var(--mono);font-size:11px;color:#6b7280}
#board svg{width:100%;height:calc(100% - 60px)}
#board .draw{fill:none;stroke-linecap:round;stroke-linejoin:round}
#board text{font-family:var(--hand)}

/* ---------- 3D ---------- */
#stage3d{position:fixed;inset:0;z-index:22;pointer-events:none;opacity:0;transition:opacity .7s}
body.show3d #stage3d{opacity:1}
#stage3d canvas{position:absolute;inset:0;width:100%;height:100%}
#stage3d.grab{pointer-events:auto;cursor:grab}#stage3d.grab.dragging{cursor:grabbing}
#player{position:fixed;left:50%;bottom:18px;transform:translate(-50%,20px);z-index:66;display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.82);backdrop-filter:blur(16px);
  border-radius:999px;padding:5px 8px;opacity:0;transition:all .4s;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#player.on{opacity:1;transform:translate(-50%,0)}
#player button{border:0;background:transparent;color:#fff;height:30px;min-width:38px;border-radius:999px;font:600 12px var(--sans);display:flex;align-items:center;justify-content:center;gap:3px}
#player button:hover{background:rgba(255,255,255,.12)}
#player .pp{width:34px;background:var(--accent);color:#06210f}
#player .go,#player .ask{padding:0 12px;background:rgba(255,255,255,.12)}
#player .go{background:var(--accent);color:#06210f}
#player .sep{width:1px;height:18px;background:rgba(255,255,255,.18);margin:0 4px}
#player .t{font-family:var(--mono);font-size:10.5px;color:rgba(255,255,255,.5);padding:0 8px 0 4px;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#leaders{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#labels{position:absolute;inset:0}
.plabel{position:absolute;transform:translate(-50%,-50%);background:rgba(255,255,255,.96);color:#121820;font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px;white-space:nowrap;box-shadow:0 6px 24px rgba(0,0,0,.35);opacity:0;transition:opacity .5s}
.plabel.on{opacity:1}
.plabel.fault{background:var(--hot);color:#fff;font-size:15px;padding:8px 14px;border-radius:12px;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.plabel.fault canvas{width:190px;height:44px}

/* ---------- crew cards (compact glass chips) ---------- */
#cards{position:fixed;right:22px;top:calc(var(--top) + 18px);bottom:200px;width:400px;z-index:40;display:flex;flex-direction:column;gap:8px;justify-content:flex-start;pointer-events:none;overflow:hidden}
.card{pointer-events:auto;background:rgba(18,22,28,.78);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:11px 13px;
  box-shadow:0 12px 36px rgba(0,0,0,.28);opacity:0;transform:translateX(24px);transition:all .5s cubic-bezier(.2,.9,.2,1);flex:none}
.card.on{opacity:1;transform:none}
.card .hd{display:flex;align-items:center;gap:8px}
.card .hd svg{width:30px;height:30px}
.card .k{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card h4{margin:2px 0 3px;font-size:17px;font-weight:650;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card p{margin:0;color:rgba(255,255,255,.72);font-size:14px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .cite{display:none}
.card .src{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--mint);border:1px solid rgba(124,240,192,.35);padding:3px 7px;border-radius:6px}
.card.diag{border-color:rgba(255,90,78,.6);background:linear-gradient(135deg,rgba(255,90,78,.2),rgba(14,18,24,.92))}
.card .row{display:flex;gap:14px;align-items:center}
.card .num{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
.wo{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;margin-top:8px}
.wo span:nth-child(odd){color:var(--muted);font-family:var(--mono);font-size:12px;padding-top:3px}
.wo span{opacity:0;transition:opacity .3s}.wo span.on{opacity:1}
.card canvas{width:100%;height:84px;margin-top:6px}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.1)}
.total b{font-size:30px}
.card .acts button{background:var(--accent)}
.lock{font-family:var(--mono);font-size:12.5px;color:var(--amber)}
.arow{display:grid;grid-template-columns:60px 54px 1fr;gap:6px;font-family:var(--mono);font-size:10.5px;padding:5px 0;border-top:1px solid rgba(255,255,255,.07)}
.arow .h{grid-column:1/-1;color:rgba(255,255,255,.3)}
.arow.deny .a{color:var(--hot)}.arow.ok .a{color:var(--mint)}

/* ---------- speech bubble beside the speaking character (Clicky style) ---------- */
#buddy{position:fixed;z-index:60;display:flex;align-items:flex-end;gap:8px;pointer-events:none;transition:left .9s cubic-bezier(.3,1.1,.4,1),top .9s cubic-bezier(.3,1.1,.4,1),opacity .3s;opacity:0}
#buddy.on{opacity:1}
#buddy svg.crew{width:86px;height:86px;flex:none;filter:drop-shadow(0 8px 18px rgba(0,0,0,.35))}
#buddy .bub{max-width:420px;background:#fbfaf5;color:#14181e;border-radius:20px 20px 20px 6px;padding:12px 16px;font-size:18px;line-height:1.35;box-shadow:0 14px 40px rgba(0,0,0,.35);opacity:0;transform:scale(.9);transform-origin:left bottom;transition:all .25s}
#buddy .bub.on{opacity:1;transform:none}
#buddy .bub .nm{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#6b7684;margin-bottom:2px}

/* ---------- team dock (bottom-right, Clicky-style buddies) ---------- */
#dock{position:fixed;right:22px;bottom:14px;z-index:62;display:flex;gap:6px;align-items:flex-end;pointer-events:none;opacity:0;transform:translateY(30px);transition:all .6s cubic-bezier(.3,1.2,.4,1)}
#dock.on{opacity:1;transform:none}
.mate{position:relative;width:104px;display:flex;flex-direction:column;align-items:center}
.mate svg.crew{width:84px;height:84px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.35))}
.mate .tag{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;background:rgba(0,0,0,.82);color:#fff;padding:3px 8px;border-radius:999px;margin-top:-2px}
.mate .st{margin-top:5px;font-size:11px;line-height:1.3;color:#fff;background:rgba(0,0,0,.72);border-radius:9px;padding:4px 7px;text-align:center;min-height:20px;max-width:104px;opacity:.0;transition:opacity .3s}
.mate .st.on{opacity:1}
.mate.active .tag{background:var(--c);color:#111}
.mate[data-who=pip]{--c:var(--pip)}.mate[data-who=scout]{--c:var(--scout)}.mate[data-who=bolt]{--c:var(--bolt)}.mate[data-who=gate]{--c:var(--gate)}
.mate .say{position:absolute;bottom:calc(100% + 4px);right:0;width:max-content;max-width:min(440px,40vw);background:#fbfaf5;color:#14181e;border-radius:18px 18px 6px 18px;padding:11px 15px;font-size:17px;line-height:1.35;box-shadow:0 14px 40px rgba(0,0,0,.35);opacity:0;transform:translateY(8px) scale(.95);transform-origin:right bottom;transition:all .25s}
.mate .say.on{opacity:1;transform:none}
.mate .say b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#6b7684;font-weight:500;margin-bottom:2px}
.handoff{position:fixed;z-index:63;font-family:var(--mono);font-size:11px;background:#fff;color:#111;padding:5px 9px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.3);transition:left .9s cubic-bezier(.5,0,.3,1),top .9s cubic-bezier(.5,0,.3,1),opacity .3s;pointer-events:none;white-space:nowrap}
#board .node rect{fill:#fff}
.filechip{position:fixed;z-index:64;display:flex;align-items:center;gap:10px;background:#fff;color:#111;border-radius:14px;padding:9px 14px 9px 10px;box-shadow:0 14px 40px rgba(0,0,0,.35);
  transition:left 1.1s cubic-bezier(.5,0,.25,1),top 1.1s cubic-bezier(.5,0,.25,1),transform 1.1s,opacity .4s;pointer-events:none;font-size:13px}
.filechip .ic{width:30px;height:36px;border-radius:5px;background:#107c41;color:#fff;font:700 10px/36px var(--mono);text-align:center;position:relative}
.filechip .ic:after{content:"";position:absolute;right:0;top:0;border-left:8px solid #0c5f32;border-bottom:8px solid #0c5f32;border-top:8px solid #fff;border-right:8px solid #fff;border-radius:0 5px 0 0}
.filechip b{display:block;font-size:13px}.filechip span{font-family:var(--mono);font-size:10.5px;color:#555}
.filechip.glow{box-shadow:0 0 0 3px #107c41,0 14px 40px rgba(16,124,65,.45)}

/* ---------- ROI ---------- */
#roi{position:fixed;left:50%;top:52%;width:min(1040px,86vw);height:min(560px,70vh);transform:translate(-50%,-46%) scale(.96);background:var(--paper);color:var(--paper-ink);border-radius:24px;z-index:45;padding:22px 28px;opacity:0;transition:all .6s;box-shadow:0 30px 90px rgba(0,0,0,.4);font-family:var(--hand)}
#roi.on{opacity:1;transform:translate(-50%,-50%)}
#roi svg{width:100%;height:100%}
#roi .draw{fill:none;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;top:calc(var(--top) + 270px);transform:translate(-50%,-10px);z-index:85;background:var(--hot);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;font-size:16px;opacity:0;transition:all .3s;pointer-events:none;box-shadow:0 18px 50px rgba(0,0,0,.35)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.ok{background:#1d8a5a}
#finale{position:fixed;left:50%;bottom:70px;transform:translate(-50%,20px);z-index:46;text-align:center;opacity:0;transition:all .6s;pointer-events:none}
#finale.on{opacity:1;transform:translate(-50%,0)}
#finale h2{font-size:42px;margin:0 0 12px;letter-spacing:-.02em;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.85)}
#finale .chips{display:flex;gap:10px;justify-content:center}
#finale .chips span{font-family:var(--mono);font-size:14px;padding:8px 14px;border-radius:999px;background:rgba(14,18,24,.92);border:1px solid rgba(255,255,255,.12)}
.hit{pointer-events:auto}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
/* approval card */
.card .who{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}
.card .who b{color:#fff;font-size:15px;background:rgba(255,255,255,.1);padding:4px 12px;border-radius:999px}
.card p.why{margin-top:8px;-webkit-line-clamp:3}
.card.ap #auditRows{max-height:150px;overflow:auto;margin-top:4px}
.card.ap.done #auditRows{max-height:84px}
.card.ap.done{border-color:rgba(124,240,192,.5)}
</style>
</head>
<body>
<div id="flash"></div><div id="sweep"></div><div id="scan"></div>
<div id="board"><h2 id="bTitle"></h2><div class="cap" id="bCap"></div><svg id="bSvg"></svg></div>
<svg id="marks"></svg>
<div id="stage3d"><canvas id="gl"></canvas><svg id="leaders"></svg><div id="labels"></div></div>
<div id="cards"></div>
<div id="roi"><svg id="roiSvg" viewBox="0 0 1040 540"></svg></div>
<div id="finale"><h2>One agent pattern. Any rotating asset.</h2><div class="chips"><span>⚡ Energy</span><span>🏭 Manufacturing</span><span>🏥 Healthcare</span><span>🚆 Transport</span></div></div>
<div id="dock">
  <div class="mate" data-who="pip"><div class="say"><b>Pip</b><span></span></div><span data-crew="pip"></span><span class="tag">Pip · guide</span><span class="st"></span></div>
  <div class="mate" data-who="scout"><div class="say"><b>Scout</b><span></span></div><span data-crew="scout"></span><span class="tag">Scout · see</span><span class="st"></span></div>
  <div class="mate" data-who="bolt"><div class="say"><b>Bolt</b><span></span></div><span data-crew="bolt"></span><span class="tag">Bolt · build</span><span class="st"></span></div>
  <div class="mate" data-who="gate"><div class="say"><b>Gate</b><span></span></div><span data-crew="gate"></span><span class="tag">Gate · rules</span><span class="st"></span></div>
</div>
<div id="buddy" style="display:none"><span data-crew="pip" id="buddyWho"></span><div class="bub"><span class="nm" id="bName">Pip</span><span id="bText"></span></div></div>
<div id="toast"></div>
<div id="player" class="hit"><button id="pGo" class="go" title="Visualize this screen (⌘⇧V)">◉ Visualize</button><button id="pAsk" class="ask" title="Ask a question (⌘⇧Space)">🎙 Ask</button><i class="sep"></i><button id="pBack" title="Back 10 s (⌘⇧←)">↺ 10</button><button id="pPlay" class="pp" title="Pause (⌘⇧P)">❚❚</button><button id="pFwd" title="Forward 10 s (⌘⇧→)">10 ↻</button><span class="t" id="pNow"></span><i class="sep"></i><button id="pNew" title="Start over on another sheet (⌘⇧0)">＋ New</button></div>

<div id="notch" class="hit"><div class="clip">
  <div class="nbar"><div class="wing l"><span class="face" data-crew="pip" id="nFace"></span><span id="nWho"></span></div><div class="wing r"><span id="nAct"></span><div class="bars" id="bars"><i></i><i></i><i></i><i></i><i></i></div></div></div>
  <div class="nbody">
    <div class="nhead"><span class="dot"></span>SIDEKICK<span class="st" id="nState">READY</span></div>
